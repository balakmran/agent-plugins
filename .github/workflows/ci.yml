name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump by hand; Dependabot doesn't update Python packages installed here.
  CHECK_JSONSCHEMA_VERSION: 0.39.0

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Generated files match the catalog
        run: |
          scripts/generate.sh
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            echo "::error::Run scripts/generate.sh and commit the result."
            exit 1
          fi

      - name: Forbidden files are absent and both marketplace files agree
        run: scripts/check.sh files

      - name: Install the Claude Code CLI
        run: |
          npm install --global @anthropic-ai/claude-code@latest
          claude --version

      - name: claude plugin validate --strict
        run: scripts/check.sh validate

      - name: Install check-jsonschema
        run: pipx install "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"

      - name: Pinned tags, plugin paths and Agent Plugins manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check.sh remote
